<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6500"><meta name="description" content="Revive Fitness Studio staff portal for admissions, attendance, members, and payments."><title>Revive Fitness Studio | Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#home" aria-label="Revive Fitness home"><span class="brand-word">REV<span class="brand-v">/</span>VE</span><span class="brand-sub">FITNESS STUDIO</span></a>
    <div class="branch-pill"><i></i> KOCHI · STUDIO 01 <span class="chevron">⌄</span></div>
    <div class="nav-label">WORKSPACE</div>
    <nav class="main-nav" aria-label="Main navigation">
      <button class="nav-item active" data-page="overview"><span class="nav-icon">▦</span>Overview</button>
      <button class="nav-item" data-page="members"><span class="nav-icon">♙</span>Members <span class="nav-count" id="memberNavCount">0</span></button>
      <button class="nav-item" data-page="admissions"><span class="nav-icon">＋</span>Admissions</button>
      <button class="nav-item" data-page="attendance"><span class="nav-icon">✓</span>Attendance</button>
      <button class="nav-item" data-page="payments"><span class="nav-icon">₹</span>Payments</button>
    </nav>
    <div class="nav-label management-label">MANAGEMENT</div>
    <nav class="main-nav">
      <button class="nav-item" data-page="reports"><span class="nav-icon">▤</span>Reports</button>
      <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="sync-card"><div class="sync-top"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Demo workspace</span></div><p id="syncDescription">Connect your Google Sheet to sync live data.</p><button class="text-action" data-page="settings">Set up data connection <span>↗</span></button></div>
      <button class="user-profile" id="profileButton"><span class="avatar">RF</span><span class="profile-copy"><strong id="profileName">Studio team</strong><small id="profileRole">Staff access</small></span><span class="profile-menu">···</span></button>
    </div>
  </aside>
  <main class="main-area">
    <header class="topbar"><button class="mobile-menu" id="menuToggle" aria-label="Toggle navigation">☰</button><div class="crumb"><span>Revive Fitness</span><b>/</b><strong id="pageCrumb">Overview</strong></div><div class="top-actions"><span class="today-label" id="todayLabel"></span><button class="icon-button" id="refreshButton" aria-label="Refresh data" title="Refresh data">⟳</button><button class="top-avatar" id="topAvatar">RF</button></div></header>
    <div class="content" id="pageContent"></div>
    <footer class="footer"><span>REVIVE FITNESS STUDIO</span><span>Move better. Feel stronger.</span></footer>
  </main>
</div>
<div class="toast-region" id="toastRegion" aria-live="polite"></div>
<div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section></div>
<script src="app.js" defer></script>
</body></html>
