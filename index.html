  <!-- Display release 20261015.3: self-contained styles and navigation -->
  <style>:root{--orange:#ff6500;--ink:#252525;--muted:#707070;--line:#e2e2e2;--paper:#f7f7f7;--white:#fff;--shadow:0 12px 32px rgba(20,20,20,.045);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:var(--paper);min-height:100vh;padding:0 0 calc(70px + env(safe-area-inset-bottom));}.topbar{height:116px;background:var(--white);border-bottom:5px solid var(--orange);display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:4;box-shadow:0 4px 18px rgba(0,0,0,.04)}.brand{display:flex;justify-content:center;align-items:center;width:min(62vw,270px)}.brand img{width:100%;height:auto;display:block}.welcome{text-align:center;padding:40px 20px 28px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.19em;color:var(--muted);margin:0 0 11px}.welcome .eyebrow{display:none}h1{font-size:clamp(25px,6.1vw,41px);letter-spacing:.09em;line-height:1.15;margin:12px 0 10px;font-weight:850}.welcome h1 span{color:var(--orange)}.subtitle{font-size:clamp(17px,4.8vw,24px);color:#6c6c6c;margin:0}.module-grid{width:min(100% - 40px,650px);margin:28px auto 22px;display:grid;gap:20px}.module-card{appearance:none;width:100%;min-height:166px;border:2px solid var(--line);border-radius:24px;background:var(--white);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px;padding:24px 15px;color:var(--ink);cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}.module-card:hover{transform:translateY(-2px);border-color:#ffc49e;box-shadow:0 16px 35px rgba(255,101,0,.08)}.module-card:active{transform:scale(.99)}.module-card span:last-child{font-size:clamp(16px,4.5vw,23px);font-weight:800;letter-spacing:.055em;text-align:center}.icon{width:56px;height:56px;color:var(--orange);display:grid;place-items:center}.icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.connection{display:flex;justify-content:center;align-items:center;gap:8px;color:#777;font-size:12px;margin:22px 0 18px}.status-dot{height:8px;width:8px;border-radius:50%;background:#a5a5a5}.status-dot.live{background:#20a56b;box-shadow:0 0 0 3px #20a56b20}.footer{position:fixed;bottom:0;left:0;right:0;z-index:3;text-align:center;background:rgba(255,255,255,.96);border-top:1px solid #e8e8e8;padding:16px 12px calc(16px + env(safe-area-inset-bottom));font-size:11px;color:#777;backdrop-filter:blur(12px)}.panel-body{padding:20px 24px 26px;max-height:calc(84vh - 95px);overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-weight:700;font-size:12px;color:#444}.field input,.field select,.field textarea{width:100%;border:1px solid #d8d8d8;border-radius:11px;padding:12px 13px;background:#fff;font:inherit;font-size:14px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff65001d}.field textarea{min-height:80px;resize:vertical}.primary,.secondary,.text-button{border:0;border-radius:12px;padding:13px 17px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}.primary{background:var(--orange);color:#fff;width:100%;margin-top:17px}.secondary{background:#fff4ed;color:#d84f00;border:1px solid #ffd5bd}.text-button{background:transparent;color:var(--orange);padding:8px}.helper{color:#777;font-size:12px;line-height:1.55;margin:8px 0 0}.notice{border-radius:12px;padding:12px 14px;background:#fff5ef;color:#75401f;font-size:13px;line-height:1.5;margin:0 0 16px}.notice.good{background:#edfaf3;color:#17623d}.notice.error{background:#fff0ef;color:#a23024}.empty-state{text-align:center;padding:24px 8px;color:#777;font-size:14px}.list{display:grid;gap:10px}.list-row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #eee;border-radius:12px;padding:13px}.list-row strong{font-size:14px}.list-row small{display:block;color:#777;margin-top:4px}.pill{font-size:11px;color:#b34a0c;background:#fff1e8;border-radius:30px;padding:5px 9px;white-space:nowrap}.toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#252525;color:white;border-radius:30px;padding:12px 17px;font-size:13px;z-index:10;transition:.2s;max-width:calc(100% - 28px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.product-grid{display:grid;gap:10px}.product-card{border:1px solid #e8e8e8;border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.product-card strong{font-size:14px}.product-card small{display:block;color:#777;margin-top:4px}.product-card .price{font-weight:800;color:#222}.product-card button{grid-column:2;grid-row:1/3}.admin-nav{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.admin-nav button{white-space:nowrap;border:1px solid #eee;border-radius:999px;background:white;padding:9px 13px;font-weight:700;font-size:12px;cursor:pointer}.admin-nav button.active{background:var(--ink);color:#fff}.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{border:1px solid #eee;border-radius:14px;padding:15px}.metric strong{display:block;font-size:23px}.metric span{font-size:11px;color:#777}@media(min-width:760px){.topbar{height:130px}.welcome{padding-top:50px}.module-grid{grid-template-columns:1fr 1fr;width:min(100% - 56px,850px);gap:18px}.module-card{min-height:184px}.module-card:first-child{grid-column:1/-1}.footer{font-size:12px}}@media(max-width:420px){.topbar{height:104px}.welcome{padding-top:34px}.module-grid{width:calc(100% - 32px);gap:15px;margin-top:23px}.module-card{min-height:145px;border-radius:20px}.icon{width:48px;height:48px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel-body{padding:18px}}
/* Page navigation and GitHub Pages-safe branding */
body{padding-top:calc(116px + env(safe-area-inset-top));}
.topbar{position:fixed;top:0;left:0;right:0;height:calc(116px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);}
.brand svg{width:100%;height:auto;display:block}
.page-view{width:min(100% - 32px,760px);margin:0 auto;padding:18px 0 32px;min-height:calc(100vh - 190px)}
.page-toolbar{display:flex;align-items:center;gap:15px;padding:8px 0 18px;border-bottom:1px solid #e6e6e6;margin-bottom:8px}
.page-toolbar h2{margin:0;font-size:22px;line-height:1.2}
.page-toolbar .eyebrow{color:var(--orange);margin:0 0 4px}
.back-button{border:1px solid #e7e7e7;background:#fff;border-radius:12px;padding:11px 14px;color:var(--ink);font:inherit;font-size:14px;font-weight:750;cursor:pointer;white-space:nowrap}
.back-button:hover{border-color:#ffc49e;color:#d84f00}
.toolbar-spacer{flex:1}
#panel-content .panel-body{padding:18px 0 30px;max-height:none;overflow:visible}
@media(max-width:420px){body{padding-top:calc(104px + env(safe-area-inset-top))}.topbar{height:calc(104px + env(safe-area-inset-top))}.page-toolbar{gap:10px}.back-button{padding:10px 12px}.page-toolbar h2{font-size:19px}}

/* Full-page app shell. Hidden pages never sit underneath another view. */
[hidden]{display:none!important}
.module-card{text-decoration:none}
body[data-page]:not([data-page="home"]){background:#fff}
.brand{height:76px;max-width:270px}
.brand svg,.brand img{display:block;width:100%;height:100%;object-fit:contain;max-height:76px}
.page-view{width:100%;max-width:none;margin:0;padding:0 0 24px;border:0;border-radius:0;box-shadow:none;background:#fff;min-height:calc(100dvh - 180px)}
.page-toolbar{width:100%;margin:0;padding:20px max(18px,calc((100% - 760px)/2));border-bottom:1px solid #ededed;border-radius:0;background:#fff;min-height:90px}
.page-toolbar h2{letter-spacing:0;font-weight:800;outline:none}
.page-toolbar .eyebrow{font-size:9px}
#panel-content{width:min(100% - 36px,760px);margin:0 auto}
#panel-content .panel-body{padding:24px 0 36px;max-height:none;overflow:visible}
.field input,.field select,.field textarea{font-size:16px;min-height:48px}
.primary{min-height:48px}
.release-label{margin-left:6px;color:#8a8a8a;font-size:10px}
.page-enter{animation:pageIn .19s ease-out}
@keyframes pageIn{from{opacity:.7;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){.page-enter{animation:none}*{scroll-behavior:auto!important}}
@media(max-width:420px){.brand{height:66px}.page-toolbar h2{font-size:18px}.page-toolbar{padding:18px 16px}.page-toolbar .eyebrow{letter-spacing:.1em}}
</style>

  <header class="topbar">
    <a class="brand" href="#/home" aria-label="Revive Fitness Studio home">
      <svg id="brand-fallback" viewBox="0 0 420 110" role="img" aria-label="Revive Fitness Studio"><g fill="#292929"><path d="M7 10h45c19 0 30 9 30 25 0 12-7 20-19 23l23 29H62L41 60H25v27H7V10Zm18 15v20h26c9 0 13-3 13-10s-4-10-13-10H25Z"/><path d="M94 10h71v15h-53v15h48v14h-48v18h55v15H94z"/><path d="m173 10 25 59 25-59h20l-38 77h-15l-38-77z"/><path d="M250 10h19v77h-19z"/><path d="m276 10 25 59 25-59h20l-38 77h-15l-38-77z"/><path d="M352 10h61v15h-43v15h39v14h-39v18h45v15h-63z"/><text x="210" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" letter-spacing="4">FITNESS STUDIO</text></g></svg>

  <main id="app">
    <div id="home-view">
    <section class="welcome" aria-labelledby="welcome-title">
      <p class="eyebrow">YOUR FITNESS, IN ONE PLACE</p>
      <h1 id="welcome-title">WELCOME TO <span>REVIVE</span></h1>
      <p class="subtitle">Studio Portal</p>
    </section>
    <section class="module-grid" aria-label="Portal modules">
      <a class="module-card" data-action="admission" href="#/admission">
        <span class="icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M29 8H12a4 4 0 0 0-4 4v24a4 4 0 0 0 4 4h24a4 4 0 0 0 4-4V23M25 27l-2 8 8-2L43 21a4 4 0 0 0-6-6L25 27Z"/></svg></span><span>ADMISSION REGISTRATION</span>
      </a>
      <a class="module-card" data-action="attendance" href="#/attendance">
        <span class="icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6a18 18 0 1 0 18 18M42 11 23 30l-8-8"/></svg></span><span>DAILY ATTENDANCE</span>
      </a>
      <a class="module-card" data-action="store" href="#/store">
        <span class="icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 17h32l-3 24H11L8 17Zm8 0a8 8 0 0 1 16 0M18 25v2m12-2v2"/></svg></span><span>SUPPLEMENT STORE</span>
      </a>
      <a class="module-card" data-action="staff" href="#/staff">
        <span class="icon"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="15" r="8"/><path d="M7 41v-4a10 10 0 0 1 10-10h14a10 10 0 0 1 10 10v4"/></svg></span><span>STAFF LOGIN</span>
      </a>
      <a class="module-card" data-action="admin" href="#/admin">
        <span class="icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="m24 4 17 7v12c0 10-7 17-17 21C14 40 7 33 7 23V11l17-7Z"/></svg></span><span>ADMIN LOGIN</span>
      </a>
    </section>
    <p class="connection" id="connection-status"><span class="status-dot"></span><span>Portal ready</span></p>
    </div>
    <section id="page-view" class="page-view" hidden aria-labelledby="panel-title">
      <div class="page-toolbar"><button class="back-button" type="button" aria-label="Go back">← <span>Back</span></button><div><p class="eyebrow" id="panel-kicker">REVIVE FITNESS STUDIO</p><h2 id="panel-title" tabindex="-1">Portal</h2></div><span class="toolbar-spacer"></span></div>
      <div id="panel-content"></div>
    </section>
  </main>
  <footer class="footer">© <span id="year"></span> Revive Fitness Studio. All rights reserved. <span class="release-label" aria-label="Version 3">v3</span></footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./config.js?v=20261015.3"></script>
  <script>(() => {
  const homeView = document.querySelector('#home-view');
  const pageView = document.querySelector('#page-view');
  const content = document.querySelector('#panel-content');
  const toast = document.querySelector('#toast');
  const status = document.querySelector('#connection-status');
  const apiUrl = (window.REVIVE_CONFIG?.SHEETS_API_URL || '').trim();
  let session = null;
  let toastTimer;
  document.querySelector('#year').textContent = new Date().getFullYear();
  if (apiUrl) {
    status.querySelector('span:last-child').textContent = 'Google Sheets connection configured';
    status.querySelector('.status-dot').classList.add('live');
  }

  const esc = (value = '') => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = () => new Date().toISOString().slice(0,10);
  function notify(message) {
    toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
  }
  const routeTitles = {
    'Admission registration':'admission', 'Daily attendance':'attendance',
    'Supplement store':'store', 'Staff login':'staff', 'Admin login':'admin',
    'Staff workspace':'staff-workspace', 'Admin dashboard':'admin-dashboard'
  };
  const routeAliases = {'admission-registration':'admission','daily-attendance':'attendance',
    'supplement-store':'store','staff-login':'staff','admin-login':'admin'};
  let renderingRoute = false;
  function currentRoute() {
    const hash=location.hash.replace(/^#\/?/,'');
    return routeAliases[hash] || hash || 'home';
  }
  function setRoute(route, replace=false) {
    const depth = (history.state?.reviveDepth || 0) + (replace ? 0 : 1);
    history[replace ? 'replaceState' : 'pushState']({reviveDepth:depth},'',`#/${route}`);
  }
  function focusPage() {
    window.scrollTo({top:0,behavior:'auto'});
    const heading=pageView.hidden ? document.querySelector('#welcome-title') : document.querySelector('#panel-title');
    heading.setAttribute('tabindex','-1');
    heading.focus({preventScroll:true});
  }
  function show(title, html, kicker = 'REVIVE FITNESS STUDIO') {
    document.querySelector('#panel-title').textContent = title;
    document.querySelector('#panel-kicker').textContent = kicker;
    content.innerHTML = `<div class="panel-body">${html}</div>`;
    homeView.hidden = true;
    pageView.hidden = false;
    const route=routeTitles[title] || 'home';
    if(currentRoute()!==route) setRoute(route,renderingRoute);
    document.body.dataset.page=route;
    document.title=`${title} | Revive Fitness Studio`;
    pageView.classList.remove('page-enter');
    void pageView.offsetWidth;
    pageView.classList.add('page-enter');
    focusPage();
  }
  function renderHome() {
    pageView.hidden = true;
    homeView.hidden = false;
    content.replaceChildren();
    document.body.dataset.page='home';
    document.title='Revive Fitness Studio | Portal';
    focusPage();
  }
  function navigate(route, replace=false) {
    if(currentRoute()!==route) setRoute(route,replace);
    renderRoute();
  }
  function renderRoute() {
    const routes={home:renderHome,admission:openAdmission,attendance:openAttendance,
      store:openStore,staff:()=>openLogin('staff'),admin:()=>openLogin('admin'),
      'staff-workspace':()=>session ? staffDashboard() : openLogin('staff'),
      'admin-dashboard':()=>session?.role==='admin' ? adminDashboard() : openLogin('admin')};
    let route=currentRoute();
    if(!routes[route]){route='home';setRoute(route,true);}
    renderingRoute=true;
    try {routes[route]();} finally {renderingRoute=false;}
  }
  document.querySelector('.back-button').addEventListener('click', () => {
    if(history.state?.reviveDepth>0) history.back();
    else navigate('home',true);
  });
  window.addEventListener('hashchange',renderRoute);
  document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();navigate('home');});

  // Keep the embedded wordmark visible until the repository logo loads successfully.
  const logo=document.querySelector('#brand-image');
  const fallback=document.querySelector('#brand-fallback');
  logo.addEventListener('load',()=>{if(logo.naturalWidth>0){logo.hidden=false;fallback.hidden=true;}});
  logo.addEventListener('error',()=>{logo.hidden=true;fallback.hidden=false;});
  try {
    const logoUrl=new URL(window.REVIVE_CONFIG?.LOGO_URL || './assets/revive-logo.svg',document.baseURI);
    if(logoUrl.origin===location.origin)logoUrl.searchParams.set('revive-logo','20261015.3');
    logo.src=logoUrl.href;
  } catch { logo.hidden=true; }

  async function api(action, params = {}, method = 'GET') {
    if (!apiUrl) throw new Error('Google Sheets is not connected yet. Add the Apps Script URL in config.js.');
    if (method === 'GET') {
      // JSONP keeps read requests compatible with Apps Script web app CORS behavior.
      return new Promise((resolve, reject) => {
        const callback = `reviveCallback${Date.now()}${Math.floor(Math.random()*1000)}`;
        const script = document.createElement('script');
        const timer = setTimeout(() => { cleanup(); reject(new Error('The Sheets service did not respond. Check the Apps Script deployment.')); }, 12000);
        const cleanup = () => { clearTimeout(timer); delete window[callback]; script.remove(); };
        window[callback] = data => { cleanup(); if (data?.ok === false) reject(new Error(data.error || 'Request failed')); else resolve(data); };
        const query = new URLSearchParams({action, callback, ...params});
        script.onerror = () => { cleanup(); reject(new Error('Could not reach the Sheets service.')); };
        script.src = `${apiUrl}${apiUrl.includes('?') ? '&' : '?'}${query}`;
        document.head.appendChild(script);
      });
    }
    // Writes use text/plain to avoid a browser preflight. Apps Script returns an opaque response in no-cors mode.
    await fetch(apiUrl, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, ...params})});
    return {ok:true, queued:true};
  }
  function requireApiMessage() {
    return `<div class="notice">This service is being set up. Please contact the studio team for assistance.</div>`;
  }
  function field(label, name, type='text', attrs='') { const optional=attrs.includes('data-optional'); attrs=attrs.replace('data-optional',''); return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" ${attrs} ${optional?'':'required'}></div>`; }
  function formShell(id, fields, button='Continue', note='') { return `${note}${fields}<button class="primary" type="submit">${button}</button>`; }

  function openAdmission() {
    const fields = `<form id="admission-form"><div class="form-grid">
      ${field('Full name','name','text','autocomplete="name"')}${field('Mobile number','phone','tel','inputmode="numeric" pattern="[0-9 +()-]{8,16}" autocomplete="tel"')}
      ${field('Email (optional)','email','email','data-optional')}${field('Date of birth','dob','date','data-optional')}
      <div class="field"><label for="gender">Gender</label><select id="gender" name="gender"><option value="">Prefer not to say</option><option>Female</option><option>Male</option><option>Other</option></select></div>
      <div class="field"><label for="plan">Membership plan</label><select id="plan" name="plan" required><option value="">Select a plan</option><option>Monthly</option><option>Quarterly</option><option>Half-yearly</option><option>Annual</option></select></div>
      ${field('Start date','startDate','date',`value="${today()}"`)}${field('Emergency contact','emergencyPhone','tel','inputmode="tel" data-optional')}
      <div class="field full"><label for="goal">Fitness goal (optional)</label><textarea id="goal" name="goal" placeholder="Tell us what you would like to work towards"></textarea></div>
      </div><p class="helper">Your admission details will be recorded securely in the studio register.</p><button class="primary" type="submit">Submit admission request</button></form>`;
    show('Admission registration', apiUrl ? fields : requireApiMessage() + fields);
    document.querySelector('#admission-form')?.addEventListener('submit', async e => {
      e.preventDefault(); const data = Object.fromEntries(new FormData(e.currentTarget));
      const button = e.currentTarget.querySelector('button'); button.disabled = true; button.textContent = 'Submitting…';
      try { await api('admission', data, 'POST'); e.currentTarget.innerHTML = '<div class="notice good">Admission request submitted. The studio team can now review and complete your registration.</div>'; }
      catch(err) { notify(err.message); button.disabled = false; button.textContent = 'Submit admission request'; }
    });
  }
  function openAttendance() {
    const fields = `<form id="attendance-form"><div class="form-grid">${field('Mobile number or member ID','member','text','autocomplete="off"')}${field('Date','date','date',`value="${today()}"`)}</div><p class="helper">Ask the member to provide the mobile number on their membership record.</p><button class="primary" type="submit">Find member</button></form><div id="attendance-result"></div>`;
    show('Daily attendance', apiUrl ? fields : requireApiMessage() + fields);
    document.querySelector('#attendance-form')?.addEventListener('submit', async e => {
      e.preventDefault(); const values = Object.fromEntries(new FormData(e.currentTarget)); const out = document.querySelector('#attendance-result');
      out.innerHTML = '<p class="helper">Looking up member…</p>';
      try {
        const data = await api('lookupMember', {member:values.member});
        if (!data.member) { out.innerHTML = '<div class="notice error">No active member found. Check the details and try again.</div>'; return; }
        const m=data.member;
        out.innerHTML = `<div class="list-row"><div><strong>${esc(m.name)}</strong><small>${esc(m.memberId)} · ${esc(m.plan||'Member')}</small></div><span class="pill">${esc(m.status||'Active')}</span></div><button class="primary" id="mark-attendance">Mark present</button>`;
        document.querySelector('#mark-attendance').onclick = async ev => { ev.currentTarget.disabled=true; ev.currentTarget.textContent='Saving…'; try { await api('attendance',{memberId:m.memberId,name:m.name,date:values.date,token:session?.token},'POST'); out.innerHTML='<div class="notice good">Attendance recorded. Welcome to your workout!</div>'; } catch(err) {notify(err.message);ev.currentTarget.disabled=false;ev.currentTarget.textContent='Mark present';} };
      } catch(err) { out.innerHTML = `<div class="notice error">${esc(err.message)}</div>`; }
    });
  }
  function openStore() {
    show('Supplement store', apiUrl ? '<p class="helper">Studio supplements and current prices.</p><div id="products" class="product-grid"><div class="empty-state">Loading products…</div></div>' : requireApiMessage());
    if(!apiUrl) return;
    api('products').then(data => {
      const products=document.querySelector('#products'); if(!products) return;
      if(!data.products?.length){products.innerHTML='<div class="empty-state">No products are listed yet. Ask an admin to add products.</div>';return;}
      products.innerHTML=data.products.map(p=>`<div class="product-card"><div><strong>${esc(p.name)}</strong><small>${esc(p.description||'Available at the studio')}</small></div><span class="price">₹${esc(p.price)}</span><button class="secondary" data-product="${esc(p.id)}" data-name="${esc(p.name)}">Request</button></div>`).join('');
      products.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{ if(!session){notify('Please sign in as staff to record a sale.');openLogin('staff');return;} orderProduct(b.dataset.product,b.dataset.name); });
    }).catch(err=>{const p=document.querySelector('#products');if(p)p.innerHTML=`<div class="notice error">${esc(err.message)}</div>`;});
  }
  async function sha256(text) { const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)); return Array.from(new Uint8Array(bytes)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
  function openLogin(role) {
    const label=role==='admin'?'Admin':'Staff';
    const fields=`<form id="login-form"><div class="form-grid">${field('Staff ID','username','text','autocomplete="username"')}${field('PIN','pin','password','inputmode="numeric" autocomplete="current-password"')}</div><p class="helper">Sign-in is verified by the studio sheet. Never share your PIN.</p><button class="primary" type="submit">Sign in</button></form>`;
    show(`${label} login`, apiUrl?fields:requireApiMessage()+fields);
    document.querySelector('#login-form')?.addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));const b=e.currentTarget.querySelector('button');b.disabled=true;b.textContent='Verifying…';try{const challenge=await api('challenge',{username:data.username},'GET');const proof=await sha256(`${await sha256(data.pin)}:${challenge.nonce}`);const result=await api('login',{username:data.username,proof,nonce:challenge.nonce,role},'GET');if(!result.token)throw new Error('Login was not accepted. Check the ID and PIN.');session={token:result.token,role:result.role||role,name:result.name||data.username};notify(`Signed in as ${session.name}`);if(session.role==='admin')adminDashboard();else staffDashboard();}catch(err){notify(err.message);b.disabled=false;b.textContent='Sign in';}});
  }
  async function staffDashboard() {
    show('Staff workspace',`<div class="notice good">Signed in as <strong>${esc(session?.name||'Staff')}</strong></div><div class="admin-nav"><button data-tab="checkin">Attendance</button><button data-tab="sales">Supplement sale</button><button data-tab="admissions">Recent admissions</button></div><div id="workspace"></div>`);
    document.querySelectorAll('.admin-nav button').forEach(b=>b.onclick=()=>staffTab(b.dataset.tab));staffTab('checkin');
  }
  async function staffTab(tab) {
    const el=document.querySelector('#workspace');if(!el)return;
    if(tab==='checkin'){el.innerHTML='<div class="empty-state">Use Daily Attendance from the home screen to find a member and check them in.</div>';return;}
    if(tab==='sales'){el.innerHTML=`<form id="sale-form"><div class="form-grid">${field('Member ID (optional)','memberId')}${field('Amount (₹)','amount','number','min="1" step="0.01"')}${field('Product','product')}${field('Quantity','quantity','number','min="1" value="1"')}</div><button class="primary">Record sale</button></form>`;document.querySelector('#sale-form').onsubmit=async e=>{e.preventDefault();try{await api('sale',{...Object.fromEntries(new FormData(e.currentTarget)),staff:session.name,token:session.token},'POST');notify('Sale recorded');e.currentTarget.reset();}catch(err){notify(err.message);}};return;}
    el.innerHTML='<div class="empty-state">Loading admission requests…</div>';try{const d=await api('admissions',{token:session.token});el.innerHTML=d.admissions?.length?`<div class="list">${d.admissions.map(a=>`<div class="list-row"><div><strong>${esc(a.name)}</strong><small>${esc(a.phone)} · ${esc(a.plan)} · ${esc(a.createdAt||'')}</small></div><span class="pill">${esc(a.status||'Pending')}</span></div>`).join('')}</div>`:'<div class="empty-state">No new admissions.</div>';}catch(err){el.innerHTML=`<div class="notice error">${esc(err.message)}</div>`;}
  }
  async function adminDashboard() {
    show('Admin dashboard',`<div class="notice good">Signed in as <strong>${esc(session?.name||'Admin')}</strong></div><div class="admin-nav"><button data-tab="overview">Overview</button><button data-tab="members">Members</button><button data-tab="attendance">Attendance</button><button data-tab="sales">Sales</button><button data-tab="staff">Staff</button><button data-tab="products">Products</button></div><div id="workspace"></div>`);
    document.querySelectorAll('.admin-nav button').forEach(b=>b.onclick=()=>adminTab(b.dataset.tab));adminTab('overview');
  }
  async function adminTab(tab) {
    const el=document.querySelector('#workspace');if(!el)return;
    document.querySelectorAll('.admin-nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
    if(tab==='overview'){el.innerHTML='<div class="empty-state">Loading studio summary…</div>';try{const d=await api('summary',{token:session.token});el.innerHTML=`<div class="metric-grid">${[['Active members',d.activeMembers],['Today attendance',d.todayAttendance],['Pending admissions',d.pendingAdmissions],['Today sales',`₹${d.todaySales||0}`]].map(([l,v])=>`<div class="metric"><strong>${esc(v??0)}</strong><span>${l}</span></div>`).join('')}</div>`;}catch(err){el.innerHTML=`<div class="notice error">${esc(err.message)}</div>`;}return;}
    if(tab==='members'||tab==='attendance'||tab==='sales'||tab==='staff'||tab==='products'){
      el.innerHTML='<div class="empty-state">Loading…</div>';try{const d=await api(tab,{token:session.token});const rows=d[tab]||[];el.innerHTML=rows.length?`<div class="list">${rows.map(row=>`<div class="list-row"><div><strong>${esc(row.name||row.memberId||row.product||row.username||row.date||'Record')}</strong><small>${esc(Object.entries(row).filter(([k])=>!['name','memberId','product','username','date'].includes(k)).slice(0,3).map(([k,v])=>`${k}: ${v}`).join(' · '))}</small></div>${row.status?`<span class="pill">${esc(row.status)}</span>`:''}</div>`).join('')}</div>`:'<div class="empty-state">No records found.</div>';}catch(err){el.innerHTML=`<div class="notice error">${esc(err.message)}</div>`;}return;
    }
  }
  async function orderProduct(id,name){const qty=prompt(`Quantity of ${name}?`,'1');if(!qty)return;try{await api('sale',{productId:id,product:name,quantity:qty,staff:session.name,token:session.token},'POST');notify('Order recorded');}catch(err){notify(err.message);}}
  document.querySelectorAll('.module-card').forEach(card=>card.addEventListener('click',e=>{
    e.preventDefault();navigate(card.dataset.action);
  }));
  history.replaceState({reviveDepth:0},'',`#/${currentRoute()}`);
  renderRoute();
})();
</script>
</body>
</html>
